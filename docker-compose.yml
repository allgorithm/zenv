services:
  # PHP Application (Composer, Artisan, Node/NPM, PHP-FPM)
  app:
    build:
      context: .
      dockerfile: docker/Dockerfile
      args:
        UID: ${USER_UID:-1000}
        GID: ${USER_GID:-1000}
    container_name: zenv-app
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - .:/var/www/html
    ports:
      - "5173:5173" # Vite dev server
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - redis
    networks:
      - zenv-network

  # Web Server (Nginx)
  web:
    image: nginx:alpine
    container_name: zenv-web
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - .:/var/www/html
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app
    networks:
      - zenv-network

  # Redis (Cache / Queue)
  redis:
    image: redis:alpine
    container_name: zenv-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    networks:
      - zenv-network

  # Mailpit (Mail Testing)
  mailpit:
    image: axllent/mailpit
    container_name: zenv-mailpit
    restart: unless-stopped
    ports:
      - "1025:1025" # SMTP Port
      - "8025:8025" # Webmail UI Port
    networks:
      - zenv-network

  # MinIO (Local S3 Storage)
  minio:
    image: minio/minio:latest
    container_name: zenv-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET:-minioadmin}
    ports:
      - "9000:9000" # S3 API
      - "9001:9001" # Web Console UI
    volumes:
      - minio-data:/data
    networks:
      - zenv-network

  # Automatic Queue Worker
  queue:
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: zenv-queue
    restart: unless-stopped
    command: php artisan queue:work --verbose --tries=3 --timeout=90
    volumes:
      - .:/var/www/html
    depends_on:
      - app
      - redis
    networks:
      - zenv-network

networks:
  zenv-network:
    driver: bridge

volumes:
  redis-data:
    driver: local
  minio-data:
    driver: local
